name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Download dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Run go vet
      run: go vet ./...

    - name: Build
      run: go build -v -ldflags="-X github.com/hexbay/xmap/pkg/runner.Version=dev-${GITHUB_SHA::7}" .

  build-matrix:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          go build -ldflags="-s -w -X github.com/hexbay/xmap/pkg/runner.Version=dev-${GITHUB_SHA::7}" -o xmap-${{ matrix.goos }}-${{ matrix.goarch }}.exe .
        else
          go build -ldflags="-s -w -X github.com/hexbay/xmap/pkg/runner.Version=dev-${GITHUB_SHA::7}" -o xmap-${{ matrix.goos }}-${{ matrix.goarch }} .
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xmap-${{ matrix.goos }}-${{ matrix.goarch }}
        path: xmap-*
