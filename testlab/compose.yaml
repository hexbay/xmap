services:
  simulators:
    build:
      context: ..
      dockerfile: testlab/Dockerfile.simulator
    networks:
      testlab: { ipv4_address: 10.254.0.20 }

  http:
    image: nginx:1.27-alpine
    networks:
      testlab: { ipv4_address: 10.254.0.10 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7.4-alpine
    networks:
      testlab: { ipv4_address: 10.254.0.11 }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: xmap
    networks:
      testlab: { ipv4_address: 10.254.0.12 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: xmap
    networks:
      testlab: { ipv4_address: 10.254.0.13 }
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -pxmap"]
      interval: 3s
      timeout: 3s
      retries: 20

  samba:
    image: dperson/samba:latest
    command: ["-s", "public;/share;yes;no;yes;all"]
    networks:
      testlab: { ipv4_address: 10.254.0.14 }

networks:
  testlab:
    ipam:
      config:
        - subnet: 10.254.0.0/24
